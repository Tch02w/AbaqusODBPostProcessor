[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abaqus-odb-postprocessor"
version = "0.2.0"
description = "Abaqus 2025 grouped ODB extraction, contour animation, and pile force/moment postprocessing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "Pillow>=11.0",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "XlsxWriter>=3.2",
]

[project.scripts]
abaqus-odb-post = "abaqus_odb_postprocessor.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abaqus_odb_postprocessor = ["defaults.json", "abaqus_scripts/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
