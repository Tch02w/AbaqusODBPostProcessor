[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abaqus-odb-postprocessor"
version = "0.8.1"
description = "Abaqus 2025 grouped ODB extraction, contour animation, and pile force/moment postprocessing"
readme = "README.md"
requires-python = ">=3.15.0b1,<3.16"
dependencies = [
  "abaqus-workbench-core",
  "PySide6>=6.8",
  "Pillow>=11.0",
  "numpy>=2.0",
  "XlsxWriter>=3.2",
]

[project.optional-dependencies]
matplotlib = ["matplotlib>=3.9"]

[tool.uv.sources]
abaqus-workbench-core = { workspace = true }

[project.gui-scripts]
abaqus-odb-post = "abaqus_odb_postprocessor.application:main"
abaqus-odb-results = "abaqus_odb_postprocessor.result_browser:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abaqus_odb_postprocessor = ["defaults.json", "abaqus_scripts/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
