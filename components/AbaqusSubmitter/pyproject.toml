[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abaqus-submitter"
version = "0.1.0"
requires-python = ">=3.15.0b1,<3.16"
dependencies = [
    "abaqus-workbench-core",
    "paramiko>=4.0,<5.0",
    "psutil>=5.9",
    "PySide6>=6.8",
]

[tool.uv.sources]
abaqus-workbench-core = { workspace = true }

[project.gui-scripts]
abaqus-submitter = "abaqus_submitter.__main__:run"

[tool.setuptools.packages.find]
include = ["abaqus_submitter*"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
