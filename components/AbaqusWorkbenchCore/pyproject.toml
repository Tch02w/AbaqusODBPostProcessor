[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abaqus-workbench-core"
version = "0.1.0"
description = "Shared infrastructure for the Abaqus desktop workbench"
requires-python = ">=3.15.0b1,<3.16"
dependencies = ["PySide6>=6.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
