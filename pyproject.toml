[project]
name = "abaqus-submitter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "PySide6>=6.5",
]

[project.gui-scripts]
abaqus-submitter = "abaqus_submitter.__main__:run"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
