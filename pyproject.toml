[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abaqus-workbench"
version = "0.1.0"
description = "Unified PySide6 workbench for Abaqus submission and ODB postprocessing"
readme = "README.md"
requires-python = ">=3.15.0b1,<3.16"
dependencies = [
  "abaqus-workbench-core",
  "abaqus-odb-postprocessor",
  "abaqus-submitter",
]

[project.gui-scripts]
abaqus-workbench = "abaqus_workbench.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
prerelease = "allow"

[tool.uv.workspace]
members = [
  "components/AbaqusWorkbenchCore",
  "components/AbaqusODBPostProcessor",
  "components/AbaqusSubmitter",
]

[tool.uv.sources]
abaqus-workbench-core = { workspace = true }
abaqus-odb-postprocessor = { workspace = true }
abaqus-submitter = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.0",
  "ruff>=0.11",
]

[tool.ruff]
line-length = 120
